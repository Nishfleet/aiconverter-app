version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Patch and minor updates inside a ^ range touch only the lockfile, which
    # CODEOWNERS leaves unowned, so they auto-merge. A major, or any bump to an
    # exact pin, edits package.json and waits for the owner.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
