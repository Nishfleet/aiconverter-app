# GitHub's documented Dependabot recipe ("Automating Dependabot with GitHub
# Actions"): patch and minor updates arm auto-merge, majors stay manual.
# pull_request_target runs main's copy of this file and checks nothing out.
name: Dependabot auto-merge
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  auto-merge:
    name: Arm auto-merge for patch and minor updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.event.pull_request.user.id == 49699333 }} # dependabot[bot]
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: >-
          contains(steps.metadata.outputs.update-type, 'version-update:semver-patch') ||
          contains(steps.metadata.outputs.update-type, 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
