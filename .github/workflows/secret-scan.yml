name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# One live scan per branch on the shared runner; superseded runs cancelled so
# a push queue cannot stall the required Gitleaks context (same discipline as
# siterep-public's Secret Scan).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action v3 installs the scanner under os.tmpdir() (system
      # /tmp on this self-hosted runner) and never cleans up, so the shared
      # VPS verification runner breaks two ways:
      #   - the actions-cache restore fails with "Cannot mkdir /tmp:
      #     Read-only file system" because the cached archive stores the
      #     /tmp/gitleaks-* tree as workspace-escaped relative paths;
      #   - the download fallback then fails against a stale file left by a
      #     previous run: "Destination file path /tmp/gitleaks.tmp already
      #     exists".
      # Install the pinned scanner into the per-job workspace instead: the
      # workspace is always writable and checkout's clean wipes it before
      # every job, so no stale state can ever accumulate and no actions
      # cache is involved.
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.gitleaks"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$GITHUB_WORKSPACE/.gitleaks/gitleaks.tgz" \
            "https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/.gitleaks/gitleaks.tgz" -C "$GITHUB_WORKSPACE/.gitleaks"
          "$GITHUB_WORKSPACE/.gitleaks/gitleaks" version
      - name: Scan repository
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/.gitleaks/gitleaks
        run: |
          set -euo pipefail
          log_opts=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Scan exactly the commits this PR introduces, mirroring the
              # range gitleaks-action v3 computed from the PR commit list.
              log_opts="--no-merges --first-parent ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              # Scan exactly the commits this push introduced. All-zero SHAs
              # mean a branch was created or deleted; neither can happen on
              # protected main, but mirror the action's guards anyway.
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                log_opts="-1"
              elif [ "$GITHUB_SHA" = "0000000000000000000000000000000000000000" ]; then
                echo "No commits to scan"
                exit 0
              else
                log_opts="--no-merges --first-parent ${{ github.event.before }}..${GITHUB_SHA}"
              fi
              ;;
          esac
          args=(detect --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug)
          if [ -n "$log_opts" ]; then
            args+=(--log-opts "${log_opts}")
          fi
          set +e
          "$GITLEAKS_BIN" "${args[@]}"
          rc=$?
          set -e
          # Exit-code contract is the same as gitleaks-action v3:
          # 0 = clean, 2 = leaks found, anything else = scanner error.
          if [ "$rc" -eq 0 ]; then
            echo "No leaks detected"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::Leaks detected - see results.sarif for details"
            exit 1
          else
            echo "::error::Unexpected exit code [$rc] from gitleaks"
            exit 1
          fi
  semgrep:
    # Batched into the Secret Scan workflow per the CI standard's batching
    # preference: this file already runs on pull_request + push to main with
    # least-privilege permissions and per-branch concurrency, so a second
    # on:pull_request workflow would only double the queue on the shared
    # runner. Mirrors siterep-public's Secret Scan semgrep job shape.
    name: semgrep
    runs-on: ubuntu-latest
    # ~20-40s observed for both configs on a peer repo; 10 minutes is ~3x a
    # cold registry fetch + scan with shared-runner queue headroom.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          # Pinned to an exact release (published 2026-07-28, >7 days old).
          # Bump deliberately; do not use `latest` or a floating range.
          pip install semgrep==1.172.0
      - name: Semgrep scan (canonical orchestration gate + p/default)
        run: |
          set -uo pipefail
          # The orchestration ruleset is consumed by PINNED raw URL pointing
          # at the canonical copy in Nishfleet/siterep-public at an exact
          # commit SHA. Per-repo copies are FORBIDDEN — one canonical source,
          # every repo consumes it by pin. p/default adds defense-in-depth.
          # The job fails only on ERROR/HIGH-tier findings (semgrep's ERROR
          # == HIGH); lower-severity p/default findings are reported but do
          # not block, so pre-existing MEDIUM/WARNING/INFO noise does not
          # stall every PR.
          CANONICAL_SHA="4738f06365012bc9f1f54c5981cedf9ddd3fa1eb"
          CANONICAL_URL="https://raw.githubusercontent.com/Nishfleet/siterep-public/${CANONICAL_SHA}/.semgrep/no-hand-built-orchestration.yml"
          semgrep --config "${CANONICAL_URL}" \
                  --config p/default \
                  --quiet --metrics=off --json > semgrep-results.json
          jq -r '.results[] | "::" + (.extra.severity | ascii_downcase) + "::" + .path + ":" + (.start.line|tostring) + " [" + .check_id + "] " + (.extra.message | gsub("\n";" "))' semgrep-results.json 2>/dev/null || true
          if jq -e '[.results[] | select(.extra.severity | ascii_downcase | IN("error","high"))] | length > 0' semgrep-results.json >/dev/null 2>&1; then
            echo "::error::Semgrep found ERROR/HIGH-severity findings (listed above)."
            exit 1
          fi
          echo "::notice::Semgrep clean (no ERROR/HIGH findings)."
