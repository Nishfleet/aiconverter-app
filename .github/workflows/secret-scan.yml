name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: [self-hosted, linux, x64, vps-verify]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action v3 downloads the scanner to /tmp/gitleaks.tmp and does
      # not clean up after itself; on the shared self-hosted runner a stale
      # file from a previous run makes the install step fail with "Destination
      # file path /tmp/gitleaks.tmp already exists". Remove it before scanning.
      - name: Clear stale gitleaks download
        run: rm -f /tmp/gitleaks.tmp
      - name: Scan repository
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
