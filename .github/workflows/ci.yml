# The pull request gate for aiconverter.app. Each job names the rule or
# incident behind it. Runs on every pull request and again in the merge queue.
name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # Pricing check, unit tests, build: AGENTS.md "Checks" (deploy.yml shipped
    # main without them before #284). Lint: the app-code comment ban
    # (aiconverter-app#259). Typecheck: the payment/sign-in/entry Pages
    # functions are type-checked with strict checkJs (aiconverter-app#306).
    # No helper scripts: the no-glue standing rule.
    # One matrix leg per check name the main ruleset requires.
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Pricing check
            run: npm run check:pricing
          - check: Unit tests
            run: node --test tests/*.test.mjs
          - check: Build
            run: npm run lint && npm run build && test -z "$(git ls-files scripts bin tools ops .specify '*.sh')"
          - check: Typecheck
            run: npm run typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  semgrep:
    # No hand-built orchestration: the no-glue standing rule at the static-gate
    # rung (fleet-ops#9297). One canonical ruleset, consumed by pinned URL.
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config https://raw.githubusercontent.com/Nishfleet/siterep-public/4738f06365012bc9f1f54c5981cedf9ddd3fa1eb/.semgrep/no-hand-built-orchestration.yml --severity ERROR --error --metrics=off

  actionlint:
    # deploy.yml only runs on main, so a broken workflow edit is caught before
    # merge only here (#185).
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: false
          pyflakes: false

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  preview:
    # Owner decision 2026-11-01 (fleet-ops#10935): a preview link the owner can
    # click is the last gate of every product PR. Each PR deploys to the
    # pr-<number> branch of the Pages project, so the link is stable across
    # pushes: https://pr-<number>.aiconverter-wnm.pages.dev. Skipped in the merge
    # queue (no PR there) and for Dependabot (its runs get no Actions
    # secrets); GitHub counts a skipped job as passing.
    name: preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist --project-name aiconverter --branch pr-${{ github.event.pull_request.number }} --commit-dirty=true
