# The pull request gate for aiconverter.app. Each job names the rule or
# incident behind it. Runs on every pull request and again in the merge queue.
name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # Pricing check, unit tests, build: AGENTS.md "Checks" (deploy.yml shipped
    # main without them before #284). Lint: the app-code comment ban
    # (aiconverter-app#259). Typecheck: the payment/sign-in/entry Pages
    # functions are type-checked with strict checkJs (aiconverter-app#306); it
    # runs in the Build leg so the required Build check blocks a type error.
    # No helper scripts: the no-glue standing rule.
    # One matrix leg per check name the main ruleset requires.
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Pricing check
            run: npm run check:pricing
          - check: Unit tests
            run: node --test tests/*.test.mjs
          - check: Build
            run: npm run lint && npm run typecheck && npm run build && test -z "$(git ls-files scripts bin tools ops .specify '*.sh')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  semgrep:
    # No hand-built orchestration: the no-glue standing rule at the static-gate
    # rung (fleet-ops#9297). One canonical ruleset, consumed by pinned URL.
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config https://raw.githubusercontent.com/Nishfleet/siterep-public/4738f06365012bc9f1f54c5981cedf9ddd3fa1eb/.semgrep/no-hand-built-orchestration.yml --severity ERROR --error --metrics=off

  actionlint:
    # deploy.yml only runs on main, so a broken workflow edit is caught before
    # merge only here (#185).
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: false
          pyflakes: false

  zizmor:
    # Workflow edits that weakened a gate (SHA pin removed, token scope,
    # dispatch: #275, #287, #290). zizmor's own action, without Advanced
    # Security so a high finding fails the job
    # (https://github.com/zizmorcore/zizmor-action#usage-without-github-advanced-security).
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: high

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  preview:
    # Owner decision 2026-11-01 (fleet-ops#10935): a preview link the owner can
    # click is the last gate of every product PR. Each PR deploys a cf preview
    # named pr-<number> (aiconverter-app#341), so repeats of one PR redeploy
    # the same preview. Skipped in the merge queue (no PR there) and for
    # Dependabot (its runs get no Actions secrets); GitHub counts a skipped
    # job as passing.
    name: preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache in a job that deploys: a poisoned cache entry would ship
      # (zizmor cache-poisoning, https://docs.zizmor.sh/audits/#cache-poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # cf, since the project builds for cf (aiconverter-app#341); same
      # shape as seo-fix-kit's preview job. The preview is idle by design:
      # cloudflare.config.ts gives it no bindings, so it never touches
      # production data, and the pass mark is the link Cloudflare makes.
      - name: Deploy the preview, and fail when Cloudflare makes no link
        id: preview
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: "false"
        run: |
          npx cf previews deploy "pr-$PR" | tee "$RUNNER_TEMP/preview.out"
          url=$(grep -m1 -oE 'https://pr-[0-9]+-[a-z0-9.-]+' "$RUNNER_TEMP/preview.out" || true)
          curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 5 "${url:?Cloudflare made no preview link}"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
