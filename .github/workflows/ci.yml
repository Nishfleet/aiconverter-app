name: CI

# Fast, offline gates on every PR: pricing consistency, unit tests, a
# production build, and the app-code ESLint comment ban. Pricing check, Unit
# tests and Build are required to merge into main (see the
# main-required-checks ruleset), complementing the required Gitleaks,
# actionlint and semgrep checks. Lint joins that required set once the ruleset
# names it (aiconverter-app#259).
#
# Actions are pinned to commit SHAs with a version comment so Dependabot can
# keep them current (same convention as secret-scan.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pricing:
    name: Pricing check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check pricing consistency
        run: npm run check:pricing
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops .specify '*.sh')"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: node --test tests/*.test.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  actionlint:
    # Lint job config is wiring, not a ruleset — duplicated per repo is
    # acceptable (the canonical semgrep ruleset is NOT duplicated; it is
    # consumed by pinned raw URL in secret-scan.yml). Same job shape as
    # siterep-public's actionlint: SHA-pinned action, uses:-only.
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # shellcheck/pyflakes are optional extras; keep the job hermetic
          # and avoid the pipx install path on the hosted runner.
          shellcheck: false
          pyflakes: false
