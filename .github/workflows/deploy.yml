# Every merge to main deploys to Cloudflare Pages. Incident: merges landed on
# main but never reached aiconverter.app because no deploy workflow existed.
# The merge queue already ran CI on this exact tree, so the job only builds
# and publishes. Do not also turn on the Pages Git integration: two writers
# to one project race, last writer wins.
name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy
    environment:
      name: production
      url: https://aiconverter.app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A deploy never restores the Actions cache (https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist --project-name aiconverter --branch main --commit-dirty=true
      # Pages keeps every deployment; a failed smoke is rolled back with the dashboard's Rollback button.
      - id: smoke
        timeout-minutes: 3
        run: curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 6 https://aiconverter.app/
