name: Lighthouse

# Audits the live pages against the fleet speed budget (fleet-ops
# config/lighthouserc.json) after every production deploy and weekly. A red
# job is the signal.

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Pinned to a commit SHA, not the mutable `main` ref: a reusable workflow
    # called on a mutable ref runs whatever that ref points to when the job
    # starts, so an upstream push would control what executes here, with this
    # repository's automatic token and checkout. Bump the SHA deliberately;
    # Dependabot's github-actions updater keeps it current.
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@cbdfbf28550851abccfb7a4568696e22ac50df21 # fleet-ops main, 2026-10-12
    permissions:
      contents: read
    with:
      urls: |
        https://aiconverter.app/
        https://aiconverter.app/bank-statement-pdf-to-csv/
        https://aiconverter.app/pricing/
        https://aiconverter.app/receipt-to-csv/
        https://aiconverter.app/about/
