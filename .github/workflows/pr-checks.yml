name: PR checks

# Consolidated pull-request validation gate for the PR-blocking checks that
# the old CI + Secret Scan workflows ran. Two separate workflows paid two
# controller spin-ups per PR; they now share one workflow. Every job name
# the branch-protection rules reference (Pricing check, Unit tests, Build,
# Gitleaks) is preserved verbatim under its `name:` field, so the required
# contexts resolve exactly as before.
#
# Each required-context job calls the ./.github/actions/docs-classify
# composite action at the top. If every changed file is prose/evidence
# (conservative allowlist, fail-closed on any detection problem), the job
# reaches a real success conclusion in ~5s by skipping its heavy install /
# build / test steps. If anything else changed, the full suite runs.
# This is the standing rule from 2026-08-23: a SKIPPED required context
# counts as SATISFIED, and silently skipping the gate is worse than
# running it - so the job ALWAYS runs and ONLY its heavy steps gate.
#
# Concurrency with cancel-in-progress bounds the queue to one live run per
# PR head / main ref; superseded runs cancel instead of queueing behind
# each other. Observed on this repo: 8+ superseded runs/week before this
# change, each paying ~3 min of boot + npm ci before being cancelled.
#
# review-gate.yml is left as its own workflow on purpose: the Review gate
# context is NOT a branch-protection required check (see the protection
# query 2026-08-24: ['Gitleaks', 'Pricing check', 'Unit tests', 'Build']),
# so the doc-only PRs skip it entirely via paths-ignore without lying about
# gate status.

on:
  pull_request:
  push:
    branches: [main]

# No workflow-level paths-ignore here: every job in this workflow is a
# required context (Gitleaks, Pricing check, Unit tests, Build). The
# docs-classify action inside each job handles the fast path. The
# review-gate workflow has its own paths-ignore.

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pricing:
    name: Pricing check
    runs-on: ubuntu-latest
    steps:
      - name: Classify the PR (docs-only fast path)
        id: docs
        uses: ./.github/actions/docs-classify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Docs-only fast path
        if: steps.docs.outputs.docs-only == 'true'
        run: |
          echo "::notice::Docs-only PR - Pricing check skipped."
      - name: Checkout
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.docs.outputs.docs-only != 'true'
        run: npm ci
      - name: Check pricing consistency
        if: steps.docs.outputs.docs-only != 'true'
        run: npm run check:pricing

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Classify the PR (docs-only fast path)
        id: docs
        uses: ./.github/actions/docs-classify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Docs-only fast path
        if: steps.docs.outputs.docs-only == 'true'
        run: |
          echo "::notice::Docs-only PR - Unit tests skipped."
      - name: Checkout
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.docs.outputs.docs-only != 'true'
        run: npm ci
      - name: Run unit tests
        if: steps.docs.outputs.docs-only != 'true'
        run: node --test tests/*.test.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Classify the PR (docs-only fast path)
        id: docs
        uses: ./.github/actions/docs-classify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Docs-only fast path
        if: steps.docs.outputs.docs-only == 'true'
        run: |
          echo "::notice::Docs-only PR - Build skipped."
      - name: Checkout
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.docs.outputs.docs-only != 'true'
        run: npm ci
      - name: Build
        if: steps.docs.outputs.docs-only != 'true'
        run: npm run build

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Classify the PR (docs-only fast path)
        id: docs
        uses: ./.github/actions/docs-classify
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Docs-only fast path
        if: steps.docs.outputs.docs-only == 'true'
        run: |
          echo "::notice::Docs-only PR - Gitleaks skipped."
      - name: Checkout
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action v3 installs the scanner under os.tmpdir() (system
      # /tmp on this self-hosted runner) and never cleans up, so the shared
      # VPS verification runner breaks two ways:
      #   - the actions-cache restore fails with "Cannot mkdir /tmp:
      #     Read-only file system" because the cached archive stores the
      #     /tmp/gitleaks-* tree as workspace-escaped relative paths;
      #   - the download fallback then fails against a stale file left by a
      #     previous run: "Destination file path /tmp/gitleaks.tmp already
      #     exists".
      # Install the pinned scanner into the per-job workspace instead: the
      # workspace is always writable and checkout's clean wipes it before
      # every job, so no stale state can ever accumulate and no actions
      # cache is involved.
      - name: Install Gitleaks
        if: steps.docs.outputs.docs-only != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.gitleaks"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$GITHUB_WORKSPACE/.gitleaks/gitleaks.tgz" \
            "https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/.gitleaks/gitleaks.tgz" -C "$GITHUB_WORKSPACE/.gitleaks"
          "$GITHUB_WORKSPACE/.gitleaks/gitleaks" version
      - name: Scan repository
        if: steps.docs.outputs.docs-only != 'true'
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/.gitleaks/gitleaks
        run: |
          set -euo pipefail
          log_opts=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Scan exactly the commits this PR introduces, mirroring the
              # range gitleaks-action v3 computed from the PR commit list.
              log_opts="--no-merges --first-parent ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              # Scan exactly the commits this push introduced. All-zero SHAs
              # mean a branch was created or deleted; neither can happen on
              # protected main, but mirror the action's guards anyway.
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                log_opts="-1"
              elif [ "$GITHUB_SHA" = "0000000000000000000000000000000000000000" ]; then
                echo "No commits to scan"
                exit 0
              else
                log_opts="--no-merges --first-parent ${{ github.event.before }}..${GITHUB_SHA}"
              fi
              ;;
          esac
          args=(detect --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug)
          if [ -n "$log_opts" ]; then
            args+=(--log-opts "${log_opts}")
          fi
          set +e
          "$GITLEAKS_BIN" "${args[@]}"
          rc=$?
          set -e
          # Exit-code contract is the same as gitleaks-action v3:
          # 0 = clean, 2 = leaks found, anything else = scanner error.
          if [ "$rc" -eq 0 ]; then
            echo "No leaks detected"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::Leaks detected - see results.sarif for details"
            exit 1
          else
            echo "::error::Unexpected exit code [$rc] from gitleaks"
            exit 1
          fi
